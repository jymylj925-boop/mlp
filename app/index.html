<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1019"><title>MR FILM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#f6f7fb;font-family:tahoma}header{padding:18px 5%;background:linear-gradient(110deg,#301126,#131e32);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3}h1{color:#fa315e;margin:0;font-size:25px}button,input{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;background:#ed315b;color:white;cursor:pointer}.ghost{background:#263247}main{max-width:1200px;margin:auto;padding:20px 5%}.hero{padding:25px;border-radius:18px;background:linear-gradient(110deg,#40142b,#182840);margin:12px 0 25px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.tools input{flex:1;min-width:170px;background:#182233;border:1px solid #35445c;color:white;border-radius:9px;padding:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.card{background:#182233;border-radius:13px;overflow:hidden;cursor:pointer}.card img{width:100%;height:205px;object-fit:cover;background:#283449}.card h3{font-size:14px;padding:0 10px}.muted{font-size:12px;color:#aab8ca;padding:0 10px 12px}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:15px;z-index:5}.panel{background:#182233;border-radius:15px;padding:20px;width:min(100%,560px);max-height:90vh;overflow:auto}.panel img{max-width:130px;float:left;margin:0 0 12px 15px;border-radius:8px}.panel input{display:block;width:100%;margin:8px 0;padding:11px;background:#0b1019;border:1px solid #35445c;color:white;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hide{display:none}.episode{display:block;background:#263247;margin:7px 0;padding:10px;border-radius:8px}.status{color:#ff9aaa;font-size:13px}
</style></head><body><header><h1>MR FILM</h1><div><button class="ghost" onclick="openAuth()">حساب کاربری</button></div></header><main>
<section class="hero"><h2>دنیای فیلم و سریال</h2><p>فیلم‌ها و سریال‌های مورد علاقه‌ات را کشف کن.</p></section>
<div class="tools"><input id="search" placeholder="جستجوی عنوان یا ژانر..." oninput="render()"><button onclick="filterType='all';render()">همه</button><button class="ghost" onclick="filterType='movie';render()">فیلم‌ها</button><button class="ghost" onclick="filterType='series';render()">سریال‌ها</button><button class="ghost" onclick="showFavorites()">علاقه‌مندی‌ها</button></div>
<p id="status" class="status">در حال اتصال به سرور...</p><h2 id="sectionTitle">تازه‌ترین‌ها</h2><div id="catalog" class="grid"></div>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="panel" id="panel"></div></div>
<script>
const API='/backend/public/';let data={movies:[],series:[]},user=null,csrf='',filterType='all',favOnly=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function request(path,opts={}){const r=await fetch(API+path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}
async function load(){try{const d=await request('catalog.php');data={movies:d.movies||[],series:d.series||[]};user=d.user;csrf=d.csrf||'';$('status').textContent=user?'خوش آمدی '+user.username:'برای علاقه‌مندی‌ها وارد حساب شو';render()}catch(e){$('status').textContent='اتصال به سرور برقرار نشد: '+e.message}}
function allItems(){return [...data.movies,...data.series]}
function render(list=null){let items=list||allItems();const q=$('search').value.trim().toLocaleLowerCase('fa');if(filterType!=='all')items=items.filter(x=>x.type===filterType);if(q)items=items.filter(x=>(x.title+' '+x.genre).toLocaleLowerCase('fa').includes(q));const box=$('catalog');box.replaceChildren();items.forEach(x=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<img loading="lazy" src="${esc(x.poster||'')}" alt=""><h3>${esc(x.title)}</h3><div class="muted">${esc(x.year||'')} • ${esc(x.genre||'')}</div>`;el.onclick=()=>detail(x);box.append(el)});if(!items.length)box.innerHTML='<p>محتوایی پیدا نشد.</p>'}
function openModal(html){$('panel').innerHTML=html;$('modal').style.display='grid'}function closeModal(){$('modal').style.display='none'}
function detail(x){openModal(`<button class="ghost" onclick="closeModal()">بستن</button><h2>${esc(x.title)}</h2>${x.poster?`<img src="${esc(x.poster)}" alt="">`:''}<p>${esc(x.description||'توضیحی ثبت نشده است.')}</p><p>${esc(x.year||'')} | ${esc(x.genre||'')}</p><div class="row"><button onclick="toggleFavorite(${x.id},'${x.type}')">افزودن/حذف علاقه‌مندی</button>${x.watch_url?`<button onclick="watch('${esc(x.watch_url)}')">تماشا</button>`:''}</div><div id="episodes"></div>`);if(x.type==='series')loadEpisodes(x.id)}
function watch(url){try{const u=new URL(url);if(u.protocol!=='https:')throw Error();window.open(u.href,'_blank','noopener')}catch(e){alert('لینک تماشا معتبر نیست')}}
async function loadEpisodes(id){try{const d=await request('item.php?id='+id+'&type=series');$('episodes').innerHTML='<h3>فصل‌ها و قسمت‌ها</h3>'+(d.item.seasons||[]).map(e=>`<a class="episode" href="#" onclick="watch('${esc(e.watch_url)}');return false">فصل ${e.season_no}، قسمت ${e.episode_no}: ${esc(e.title)}</a>`).join('')||'هنوز قسمتی ثبت نشده است.'}catch(e){}}
function openAuth(){openModal(`<button class="ghost" onclick="closeModal()">بستن</button><h2>حساب کاربری</h2><div class="row"><button onclick="authForm('login')">ورود</button><button class="ghost" onclick="authForm('register')">ثبت‌نام</button></div><div id="authform"></div>`)}
function authForm(action){$('authform').innerHTML=`<input id="au" placeholder="نام کاربری"><input id="ap" type="password" placeholder="رمز عبور"><button onclick="auth('${action}')">${action==='login'?'ورود':'ثبت‌نام'}</button><p id="authmsg" class="status"></p>`}
async function auth(action){try{const d=await request('auth.php',{method:'POST',body:JSON.stringify({action,username:$('au').value,password:$('ap').value})});user=d.user;csrf=d.csrf;closeModal();$('status').textContent='خوش آمدی '+user.username}catch(e){$('authmsg').textContent=e.message}}
async function toggleFavorite(id,type){if(!user){alert('ابتدا وارد حساب شو');openAuth();return}try{await request('favorites.php',{method:'POST',body:JSON.stringify({id,type,csrf})});alert('علاقه‌مندی‌ها به‌روزرسانی شد')}catch(e){alert(e.message)}}
async function showFavorites(){if(!user){openAuth();return}try{const d=await request('favorites.php');const ids=d.ids||[];const items=allItems().filter(x=>ids.includes(x.type+':'+x.id));filterType='all';render(items);$('sectionTitle').textContent='علاقه‌مندی‌های من'}catch(e){alert(e.message)}}
load();
</script></body></html>
